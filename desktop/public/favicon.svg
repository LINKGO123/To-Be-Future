<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gMain" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gSweep" x1="32" y1="32" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gSheen" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- 玻璃底 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0E1116"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gSheen)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- 雷达盘 -->
  <circle cx="32" cy="32" r="21" stroke="url(#gMain)" stroke-opacity="0.65" stroke-width="1.3"/>
  <circle cx="32" cy="32" r="13.5" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2.5 3.5"/>

  <!-- 扫描扇 + 扫描线 -->
  <path d="M32 32 L32 11 A21 21 0 0 1 50.5 21.5 Z" fill="url(#gSweep)"/>
  <line x1="32" y1="32" x2="50.5" y2="21.5" stroke="#3B82F6" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 上扬资金趋势线 -->
  <polyline points="17,39 26,31 33,34 46,21" stroke="url(#gMain)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 信号点 + 光晕 -->
  <circle cx="46" cy="21" r="5.5" fill="#2563EB" fill-opacity="0.22"/>
  <circle cx="46" cy="21" r="3.2" fill="#2563EB"/>

  <!-- 中心点 -->
  <circle cx="32" cy="32" r="2" fill="#3B82F6"/>
</svg>
